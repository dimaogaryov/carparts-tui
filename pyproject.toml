[project]
name = "carparts"
version = "0.1.0"
license = "MIT"
readme = "README.md"
description = "TUI для контроля ресурса запчастей и расходников автомобиля"
requires-python = ">=3.11"
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
carparts = "carparts.app:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["carparts"]

[tool.setuptools.package-data]
carparts = ["*.tcss"]

[tool.pytest.ini_options]
pythonpath = ["."]
