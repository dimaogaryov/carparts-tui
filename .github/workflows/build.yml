name: test & build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04          # старый glibc — бинарник работает на большем числе дистрибутивов
            asset: carparts-linux-x86_64
          - os: windows-latest
            asset: carparts-windows-x86_64.exe
          - os: macos-15-intel        # Intel-маки
            asset: carparts-macos-intel
          - os: macos-latest          # Apple Silicon
            asset: carparts-macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: python packaging/build.py
      - name: smoke test
        run: |
          bin=dist/carparts; [ -f dist/carparts.exe ] && bin=dist/carparts.exe
          "$bin" --version
          "$bin" --self-test
      - name: check minimum macOS version (12 Monterey)
        if: runner.os == 'macOS'
        run: |
          python packaging/check_macos_min.py 12.0 dist/carparts \
            "$(python -c 'import sys; print(sys.base_prefix)')"
      - name: rename
        run: |
          if [ -f dist/carparts.exe ]; then mv dist/carparts.exe "dist/${{ matrix.asset }}"
          else mv dist/carparts "dist/${{ matrix.asset }}"; fi
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" assets/* --repo "${{ github.repository }}" --generate-notes
